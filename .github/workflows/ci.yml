name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck web
        working-directory: web
        run: npm run typecheck

      - name: Unit tests (web)
        working-directory: web
        run: npm test

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Unit tests (vector-db)
        working-directory: vector-db
        run: npm test

      - name: Syntax check services
        run: |
          node --check vector-db/src/server.js
          node --check vector-db/src/embed.js
          node --check mock-llm/src/server.js
          node --check scripts/smoke.mjs

      - name: Validate compose files
        run: |
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml -f compose.mock.yaml config -q

  images:
    name: Docker image (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            context: ./web
            file: ./web/Dockerfile
          - service: vector-db
            context: ./vector-db
            file: ./vector-db/Dockerfile
          - service: mock-llm
            context: ./mock-llm
            file: ./mock-llm/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Start the stack with the mock provider
        run: docker compose -f compose.yaml -f compose.mock.yaml up -d --build

      - name: Run the smoke test
        run: node scripts/smoke.mjs

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.mock.yaml logs --no-color --tail=300

      - name: Stop the stack
        if: always()
        run: docker compose -f compose.yaml -f compose.mock.yaml down -v
