worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Chat requests can contain long messages but are still bounded.
    client_max_body_size 2m;
    client_body_timeout 60s;

    # Docker's embedded DNS server. Resolving through a variable (see
    # proxy_pass below) makes nginx pick up a new web container IP after
    # `docker compose up` recreates it; a static upstream would keep the old IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    server {
        listen 80;
        server_name _;

        # Internal liveness probe for the nginx container itself.
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            set $web_upstream http://web:8080;
            proxy_pass $web_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # SSE must not be buffered. The web app also sends
            # X-Accel-Buffering: no, but disabling buffering here is the
            # reliable part because it applies to every response.
            proxy_buffering off;
            proxy_cache off;
            gzip off;

            # A model answer may take several minutes.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 5s;
        }
    }
}
