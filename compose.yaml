name: opencode-assistant

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      # Proxies /health to the web service, so nginx is "healthy" only when
      # the whole request path is actually ready.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./web
    image: opencode-web-assistant:local
    expose:
      - "8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      WORKSPACE_DIR: /workspace
      OPENCODE_DB_PATH: /data/opencode.db
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
      OPENCODE_AGENT: ${OPENCODE_AGENT:-}
      OPENCODE_CONFIG_JSON: ${OPENCODE_CONFIG_JSON:-}
      REQUIRE_MODEL: ${REQUIRE_MODEL:-true}
      # Single-dash default: set VECTOR_DB_URL= (empty) to disable RAG.
      VECTOR_DB_URL: ${VECTOR_DB_URL-http://vector-db:8080}
      VECTOR_DB_COLLECTION: ${VECTOR_DB_COLLECTION:-knowledge}
      VECTOR_DB_API_KEY: ${VECTOR_DB_API_KEY:-}
      VECTOR_DB_LIMIT: ${VECTOR_DB_LIMIT:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Provider credentials are read by OpenCode from the environment.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - opencode-data:/data
      - workspace:/workspace
    depends_on:
      vector-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  vector-db:
    build:
      context: ./vector-db
    image: opencode-vector-db:local
    expose:
      - "8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      QDRANT_URL: http://qdrant:6333
      COLLECTION: ${VECTOR_DB_COLLECTION:-knowledge}
      VECTOR_DIM: ${VECTOR_DIM:-512}
      SEED_DIR: /app/data
      SEED_ON_START: ${SEED_ON_START:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.0
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  opencode-data:
  workspace:
  qdrant-data:
